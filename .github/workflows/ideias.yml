# Antena de ideias do Órbita (tools/ideias/ideias.py): os vídeos novos dos canais de config/ideias-canais.json, com a
# transcrição (legendas automáticas pelo yt-dlp ou pelo youtube-transcript-api), no ramo órfão `ideias` (commit único,
# sem histórico): videos/<id>.json, indice.json e log.txt. Só leitura pública, sem chave e sem conta; quem lê e
# classifica é a tarefa agendada do repositório privado do app. O YouTube às vezes bloqueia os IPs do Actions: o
# motivo fica no vídeo e no log, os metadados ficam assim mesmo e a transcrição é tentada de novo nas rodadas seguintes.
name: Antena de ideias (vídeos dos canais)
on:
  schedule:
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      maximo:
        description: "Transcrições tentadas nesta rodada"
        default: "40"
      recomecar:
        description: "Recomeçar do zero, sem o ramo anterior (sim/não)"
        default: "não"
permissions:
  contents: write
  actions: write
concurrency:
  group: ideias
  cancel-in-progress: false
jobs:
  ideias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ferramentas (yt-dlp e youtube-transcript-api)
        run: |
          python -m pip install -q --upgrade yt-dlp youtube-transcript-api
          yt-dlp --version
      - name: Estado anterior (ramo ideias)
        run: |
          mkdir -p dados
          if [ "${{ inputs.recomecar }}" = "sim" ]; then echo "recomeçando do zero"
          elif git fetch -q --depth=1 origin ideias; then git archive FETCH_HEAD | tar -x -C dados
          else echo "ramo ideias ainda não existe"; fi
          ls dados
      - name: Rodada
        run: python -I tools/ideias/ideias.py --dados dados --max "${{ inputs.maximo || '40' }}"
      - name: Guardar no ramo ideias
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dados
          [ -f indice.json ] || { echo "sem índice"; exit 0; }
          git init -q
          git checkout -q -b ideias
          git config user.name "Órbita (antena de ideias)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Ideias: rodada de $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ideias
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/ideias.yml/enable" >/dev/null 2>&1 && echo "ligado: ideias.yml" || echo "não deu para religar ideias.yml"
