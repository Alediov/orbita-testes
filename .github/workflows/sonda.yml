name: Sonda das odds (uma vez, à mão)
on:
  workflow_dispatch:
    inputs:
      qual:
        description: "apifootball | theodds | espn"
        default: "theodds"
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sonda
        env:
          # chave GRATUITA da API-Football (o mesmo segredo dos cartões); o log mostra só os nomes dos mercados
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # chave GRATUITA da The Odds API (26/11/2026); o log mostra só nomes e cotas usadas
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: |
          if [ "${{ inputs.qual }}" = "apifootball" ]; then python3 -I tools/papel/sonda_odds.py
          elif [ "${{ inputs.qual }}" = "espn" ]; then python3 -I tools/papel/sonda_theodds.py --espn
          else python3 -I tools/papel/sonda_theodds.py; fi
