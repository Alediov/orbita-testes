name: Sonda da Polymarket (uma vez, à mão)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Variações do pedido dos mercados encerrados
        run: |
          G=https://gamma-api.polymarket.com
          for q in \
            "/markets?closed=true&end_date_min=2026-11-08T12:00:00Z&end_date_max=2026-11-10T12:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-08T12:00:00Z&end_date_max=2026-11-10T12:00:00Z&volume_num_min=5000&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-08T12:00:00Z&end_date_max=2026-11-10T12:00:00Z&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-10-16T02:52:50Z&end_date_max=2026-10-18T02:52:50Z&volume_num_min=5000&order=endDate&ascending=false&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-08T12:00:00Z&end_date_max=2026-11-24T22:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?limit=1"; do
            c=$(curl -s -m 30 -o r.json -w "%{http_code}" "$G$q"); n=$(python3 -c "import json;d=json.load(open('r.json'));print(len(d) if isinstance(d,list) else list(d)[:5])" 2>/dev/null || head -c 120 r.json)
            echo "$c  $n  $q"
          done
      - uses: actions/checkout@v4
      - name: O mesmo pedido pela rede.py
        run: |
          cd tools/papel && python3 -I -c "
          import urllib.request, json, rede
          base = rede.BASES['gamma'] if hasattr(rede, 'BASES') else 'https://gamma-api.polymarket.com'
          for q in ['/markets?closed=true&end_date_min=2026-11-08T12:00:00Z&end_date_max=2026-11-10T12:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100']:
              req = urllib.request.Request(base + q, headers={'User-Agent': 'orbita-testes (papel)', 'Accept': 'application/json'})
              try:
                  r = urllib.request.urlopen(req, timeout=30); print(r.status, len(json.load(r)))
              except Exception as e:
                  print('erro', e, getattr(e, 'read', lambda: b'')()[:200])
          "
