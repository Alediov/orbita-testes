name: Sonda da Polymarket (uma vez, à mão)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Variações do pedido dos mercados encerrados
        run: |
          G=https://gamma-api.polymarket.com
          for q in \
            "/markets?closed=true&end_date_min=2026-11-06T00:00:00Z&end_date_max=2026-11-08T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-08T00:00:00Z&end_date_max=2026-11-10T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-09T00:00:00Z&end_date_max=2026-11-10T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-08T00:00:00Z&end_date_max=2026-11-09T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-10T00:00:00Z&end_date_max=2026-11-12T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-12T00:00:00Z&end_date_max=2026-11-14T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-14T00:00:00Z&end_date_max=2026-11-16T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-16T00:00:00Z&end_date_max=2026-11-18T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-11-18T00:00:00Z&end_date_max=2026-11-20T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?closed=true&end_date_min=2026-05-28T00:00:00Z&end_date_max=2026-05-30T00:00:00Z&volume_num_min=5000&order=endDate&ascending=true&limit=100" \
            "/markets?limit=1"; do
            c=$(curl -s -m 30 -o r.json -w "%{http_code}" "$G$q"); n=$(python3 -c "import json;d=json.load(open('r.json'));print(len(d) if isinstance(d,list) else list(d)[:5])" 2>/dev/null || head -c 120 r.json)
            echo "$c  $n  $q"
          done
